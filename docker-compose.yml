services:
  openalgo:
    image: marketcalls/openalgo:latest
    ports:
      - "5001:5000"
    volumes:
      - ./openalgo-data:/app/data
      - ./.env:/app/.env

  investigate:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    environment:
      - OPENALGO_API_KEY=1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - openalgo
